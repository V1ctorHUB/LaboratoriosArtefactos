services:
  mosquitto:
    # Se construye desde Dockerfile.mosquitto (ver comentario ahí).
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    image: clima-mosquitto:local
    container_name: clima-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
